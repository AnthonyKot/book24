<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 405.0" width="100%" font-family="Helvetica, Arial, sans-serif" font-size="13"><rect x="0" y="0" width="488" height="405.0" fill="#ffffff"/><rect x="40" y="30" width="408" height="315.0" fill="#f4f4f4" stroke="#111"/><rect x="123.03999999999999" y="246.0" width="241.92000000000002" height="99.0" fill="none" stroke="#111"/><rect x="189.04" y="312.0" width="109.92" height="33.0" fill="none" stroke="#111"/><rect x="222.04" y="345.0" width="43.92" height="8" fill="#111"/><circle cx="244" cy="279.0" r="2.5" fill="#111"/><text x="244" y="20" text-anchor="middle">halfway line</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111"/></marker></defs><circle cx="124" cy="117.0" r="6" fill="#1a237e"/><text x="132" y="121.0"></text><circle cx="196" cy="117.0" r="6" fill="#1a237e"/><text x="204" y="121.0"></text><circle cx="292" cy="117.0" r="6" fill="#1a237e"/><text x="300" y="121.0"></text><circle cx="364" cy="117.0" r="6" fill="#1a237e"/><text x="372" y="121.0"></text><text x="376" y="121.0">your defence</text><circle cx="220" cy="99.0" r="6" fill="#c62828"/><text x="228" y="103.0">striker</text><circle cx="316" cy="69.0" r="4" fill="#ffffff" stroke="#111"/><text x="328" y="73.0">ball</text><line x1="316" y1="69.0" x2="220" y2="213.0" stroke="#111" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/><text x="160" y="201.0" fill="#111">ball played in behind</text><circle cx="244" cy="336.0" r="6" fill="#2e7d32"/><text x="254" y="340.0">A  on the line: goal covered, the space is his</text><circle cx="244" cy="279.0" r="6" fill="#2e7d32"/><text x="254" y="283.0">B  near the spot: the space is partly yours, a chip or a run past costs more</text><rect x="124" y="117.0" width="240" height="162" fill="#c62828" fill-opacity="0.08"/><text x="130" y="165.0" fill="#c62828">the space behind the defence</text><text x="40" y="395.0">Neither A nor B is right by itself; where you stand is a trade between covering the goal and covering the space, set by where the defence is, how fast the runner is and how fast you are.</text></svg>