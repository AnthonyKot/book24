<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 390" width="100%" font-family="Helvetica, Arial, sans-serif" font-size="13"><rect width="468" height="390" fill="#ffffff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111"/></marker></defs><rect x="30" y="24" width="408" height="276" fill="#f4f4f4" stroke="#111"/><rect x="113.03999999999999" y="201.0" width="241.92000000000002" height="99.0" fill="none" stroke="#111"/><rect x="179.04" y="267.0" width="109.92" height="33.0" fill="none" stroke="#111"/><rect x="212.04" y="298" width="43.92" height="6" fill="#111"/><circle cx="234" cy="234" r="2.5" fill="#111"/><text x="30" y="16" font-size="11">towards halfway ↑ (pitch cut at 46 m from the goal line)</text><rect x="114" y="84" width="240" height="180" fill="#c62828" fill-opacity="0.08"/><text x="120" y="102" fill="#c62828" font-size="12">the space behind the defence</text><circle cx="114" cy="84" r="6" fill="#1a237e"/><circle cx="186" cy="84" r="6" fill="#1a237e"/><circle cx="282" cy="84" r="6" fill="#1a237e"/><circle cx="354" cy="84" r="6" fill="#1a237e"/><text x="366" y="88" font-size="12">your defence</text><circle cx="198" cy="66" r="6" fill="#c62828"/><text x="207" y="70" font-size="13">striker</text><circle cx="330" cy="42" r="4" fill="#ffffff" stroke="#111"/><text x="342" y="46">ball</text><line x1="330" y1="42" x2="210" y2="180" stroke="#111" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/><text x="42" y="156" font-size="12">ball played in behind</text><circle cx="234" cy="291.0" r="6" fill="#2e7d32"/><text x="244" y="283.0" font-size="13">A: on the line</text><circle cx="234" cy="228" r="6" fill="#2e7d32"/><text x="244" y="220" font-size="13">B: near the spot</text><text x="30" y="322" font-size="12" fill="#111">A covers the goal and leaves the space to him. B covers part of</text><text x="30" y="338" font-size="12" fill="#111">the space and costs more to a chip or a run past. Neither is right</text><text x="30" y="354" font-size="12" fill="#111">by itself: where you stand is a trade set by where the defence is,</text><text x="30" y="370" font-size="12" fill="#111">how fast the runner is and how fast you are.</text></svg>