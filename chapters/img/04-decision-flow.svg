<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="100%" font-family="Helvetica, Arial, sans-serif" font-size="13"><rect width="760" height="540" fill="#ffffff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111"/></marker></defs><rect x="20" y="15" width="720" height="60" rx="6" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="30" y="35" font-weight="bold" fill="#111">Before it happens</text><text x="30" y="55" font-size="12">Where are you standing as the ball crosses halfway, and where is the space behind your last defender? A trade</text><text x="30" y="70" font-size="12">between covering the goal and covering the space; no fixed distance.</text><line x1="380" y1="75" x2="380" y2="105" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="450.0" y="84.0" font-size="11" text-anchor="middle">he is through</text><rect x="230" y="105" width="300" height="78" rx="6" fill="#f4f4f4" stroke="#1a237e" stroke-width="2"/><text x="240" y="125" font-weight="bold" fill="#1a237e">Stay on your feet, keep closing</text><text x="240" y="145" font-size="12">At a pace you could stop from. Tall while a</text><text x="240" y="160" font-size="12">shot is what he has; lower as a touch could</text><text x="240" y="175" font-size="12">make the ball loose.</text><line x1="380" y1="165" x2="380" y2="200" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="460.0" y="176.5" font-size="11" text-anchor="middle">he touches the ball</text><rect x="255" y="205" width="250" height="70" rx="6" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="265" y="220" font-weight="bold" fill="#111">Which way did the ball go?</text><text x="265" y="240" font-size="12">Away from his foot, towards you,</text><text x="265" y="255" font-size="12">reachable before his next touch?</text><line x1="300" y1="275" x2="150" y2="325" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="155.0" y="277.5" font-size="11" text-anchor="middle">no: the ball is his</text><line x1="460" y1="275" x2="610" y2="325" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="610.0" y="277.5" font-size="11" text-anchor="middle">yes: the ball is loose</text><rect x="20" y="320" width="290" height="100" rx="6" fill="#f4f4f4" stroke="#1a237e" stroke-width="2"/><text x="30" y="340" font-weight="bold" fill="#1a237e">Make him do something</text><text x="30" y="360" font-size="12">Shoot, or take another touch, which is</text><text x="30" y="375" font-size="12">another chance for the cue. Do not slide,</text><text x="30" y="390" font-size="12">do not slow into a shape: hips and knees</text><text x="30" y="405" font-size="12">going out is his cue to go round.</text><rect x="450" y="320" width="290" height="100" rx="6" fill="#f4f4f4" stroke="#2e7d32" stroke-width="2"/><text x="460" y="340" font-weight="bold" fill="#2e7d32">Take it</text><text x="460" y="360" font-size="12">With the hands, at the pace you can, and</text><text x="460" y="375" font-size="12">with a definite choice: hand or foot,</text><text x="460" y="390" font-size="12">never neither. Standing until chapter 3</text><text x="460" y="405" font-size="12">gives you the landing.</text><line x1="165" y1="420" x2="165" y2="450" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><line x1="595" y1="420" x2="595" y2="450" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><rect x="20" y="450" width="290" height="62" rx="6" fill="#f4f4f4" stroke="#e65100" stroke-width="2"/><text x="30" y="470" font-weight="bold" fill="#e65100">He shoots</text><text x="30" y="490" font-size="12">You are set, and the shot is chapter 2's</text><text x="30" y="505" font-size="12">subject.</text><rect x="450" y="450" width="290" height="62" rx="6" fill="#f4f4f4" stroke="#2e7d32" stroke-width="2"/><text x="460" y="470" font-weight="bold" fill="#2e7d32">Situation over</text><text x="460" y="490" font-size="12">The ball is yours; start the next attack</text><text x="460" y="505" font-size="12">(chapter 7).</text><text x="380" y="532" text-anchor="middle" font-size="11" fill="#555">Unsure which way the ball went? Say so in the match file. An invented "loose" is worse than a blank.</text></svg>