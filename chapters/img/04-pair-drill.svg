<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 278" width="100%" font-family="Helvetica, Arial, sans-serif" font-size="13"><rect width="468" height="278" fill="#ffffff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111"/></marker></defs><rect x="30" y="24" width="408" height="180" fill="#f4f4f4" stroke="#111"/><rect x="113.03999999999999" y="105.0" width="241.92000000000002" height="99.0" fill="none" stroke="#111"/><rect x="179.04" y="171.0" width="109.92" height="33.0" fill="none" stroke="#111"/><rect x="212.04" y="202" width="43.92" height="6" fill="#111"/><circle cx="234" cy="138" r="2.5" fill="#111"/><text x="30" y="16" font-size="11">towards halfway ↑ (pitch cut at 30 m from the goal line)</text><rect x="180" y="126" width="108" height="78" fill="#2e7d32" fill-opacity="0.08" stroke="#2e7d32" stroke-dasharray="4,4"/><rect x="176" y="122" width="8" height="8" fill="#c62828"/><rect x="284" y="122" width="8" height="8" fill="#c62828"/><text x="300" y="130" font-size="12">cones: his start</text><circle cx="234" cy="138" r="6" fill="#c62828"/><text x="244" y="142" font-size="13">teammate, walking pace</text><circle cx="234" cy="192" r="6" fill="#2e7d32"/><text x="244" y="196" font-size="13">you, on your feet</text><line x1="234" y1="144" x2="234" y2="180" stroke="#111" stroke-width="2"  marker-end="url(#a)"/><text x="42" y="60" font-size="12">he alternates close control and a heavy touch;</text><text x="42" y="76" font-size="12">you call "his" or "mine" as you decide</text><text x="30" y="226" font-size="12" fill="#111">On "mine" you step and take the ball standing. Rules said before</text><text x="30" y="242" font-size="12" fill="#111">the first ball: he stops when you move to collect; no slides, no</text><text x="30" y="258" font-size="12" fill="#111">contact, no kicks at hands. Uncertainty before speed.</text></svg>