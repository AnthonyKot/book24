<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 405.0" width="100%" font-family="Helvetica, Arial, sans-serif" font-size="13"><rect x="0" y="0" width="488" height="405.0" fill="#ffffff"/><rect x="40" y="30" width="408" height="315.0" fill="#f4f4f4" stroke="#111"/><rect x="123.03999999999999" y="246.0" width="241.92000000000002" height="99.0" fill="none" stroke="#111"/><rect x="189.04" y="312.0" width="109.92" height="33.0" fill="none" stroke="#111"/><rect x="222.04" y="345.0" width="43.92" height="8" fill="#111"/><circle cx="244" cy="279.0" r="2.5" fill="#111"/><text x="244" y="20" text-anchor="middle">halfway line</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111"/></marker></defs><rect x="190" y="213.0" width="108" height="132" fill="#2e7d32" fill-opacity="0.08" stroke="#2e7d32" stroke-dasharray="4,4"/><rect x="187.0" y="209.0" width="8" height="8" fill="#c62828"/><rect x="298" y="209.0" width="8" height="8" fill="#c62828"/><text x="310" y="217.0">cones: where he starts, about the penalty spot at first</text><circle cx="244" cy="225.0" r="6" fill="#c62828"/><text x="254" y="229.0">teammate, walking pace</text><circle cx="244" cy="312.0" r="6" fill="#2e7d32"/><text x="254" y="316.0">you, on your feet</text><line x1="244" y1="231.0" x2="244" y2="291.0" stroke="#111" stroke-width="2"  marker-end="url(#a)"/><text x="256" y="261.0">he alternates close control and a heavy touch</text><text x="256" y="270.0">you call "his" or "mine"; on "mine" you step and take it standing</text><text x="40" y="395.0">Rules said before the first ball: he stops when you move to collect; no slides, no contact, no kicks at hands. Uncertainty before speed.</text></svg>