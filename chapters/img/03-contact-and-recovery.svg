<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Contact is followed by a check of the ball</title>
  <desc id="desc">Move into reach, make contact, then check possession. If held, retain control through recovery. If live, follow the ball for the next action. Practice stops and resets after every ball.</desc>
  <rect width="900" height="440" rx="16" fill="#f5f7f4"/>
  <g font-family="sans-serif" fill="#213c32" text-anchor="middle">
    <text x="450" y="42" font-size="24" font-weight="bold">Move → contact → check the ball</text>
    <rect x="55" y="75" width="210" height="68" rx="10" fill="#dce9df"/>
    <rect x="345" y="75" width="210" height="68" rx="10" fill="#dce9df"/>
    <rect x="635" y="75" width="210" height="68" rx="10" fill="#dce9df"/>
    <text x="160" y="116" font-size="21">Move into reach</text>
    <text x="450" y="116" font-size="21">Make contact</text>
    <text x="740" y="116" font-size="21">Held or live?</text>
    <rect x="210" y="228" width="300" height="96" rx="10" fill="#cce1d7"/>
    <rect x="550" y="228" width="300" height="96" rx="10" fill="#f1dfc1"/>
    <text x="360" y="258" font-size="21" font-weight="bold">Held</text>
    <text x="360" y="286" font-size="18">Keep control through</text>
    <text x="360" y="310" font-size="18">landing and recovery</text>
    <text x="700" y="258" font-size="21" font-weight="bold">Live</text>
    <text x="700" y="286" font-size="18">Follow where the ball goes</text>
    <text x="700" y="310" font-size="18">for the next action</text>
    <text x="450" y="380" font-size="19">In this practice: stop after every ball and reset.</text>
    <text x="450" y="410" font-size="17">No second shot, challenge or race to stand up.</text>
  </g>
  <g fill="none" stroke="#426858" stroke-width="3">
    <path d="M265 109 H324 M316 102 L324 109 L316 116"/>
    <path d="M555 109 H614 M606 102 L614 109 L606 116"/>
    <path d="M710 143 V181 H360 V218 M353 210 L360 218 L367 210"/>
    <path d="M770 143 V198 H700 V218 M693 210 L700 218 L707 210"/>
  </g>
</svg>
