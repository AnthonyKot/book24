<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" font-family="Helvetica, Arial, sans-serif" font-size="13"><rect width="720" height="300" fill="#ffffff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111"/></marker></defs><rect x="20" y="20" width="330" height="245" fill="#f4f4f4" stroke="#111"/><text x="30" y="45" font-weight="bold">The ball is his</text><circle cx="90" cy="110" r="6" fill="#c62828"/><text x="68" y="138" font-size="13">striker</text><circle cx="290" cy="110" r="6" fill="#2e7d32"/><text x="278" y="138" font-size="13">you</text><circle cx="110" cy="118" r="5" fill="#ffffff" stroke="#111"/><text x="120" y="122" font-size="11">within a stride</text><line x1="270" y1="110" x2="220" y2="110" stroke="#2e7d32" stroke-width="2"  marker-end="url(#a)"/><text x="30" y="175" font-size="12" fill="#1a237e">the touch keeps the ball under his control: stay</text><text x="30" y="191" font-size="12" fill="#1a237e">on your feet, keep closing at a pace you can stop</text><text x="30" y="207" font-size="12" fill="#1a237e">from, make him do something</text><rect x="370" y="20" width="330" height="245" fill="#f4f4f4" stroke="#111"/><text x="380" y="45" font-weight="bold">The ball is loose</text><circle cx="440" cy="110" r="6" fill="#c62828"/><text x="418" y="138" font-size="13">striker</text><circle cx="640" cy="110" r="6" fill="#2e7d32"/><text x="628" y="138" font-size="13">you</text><circle cx="545" cy="118" r="5" fill="#ffffff" stroke="#111"/><line x1="448" y1="113" x2="535" y2="118" stroke="#111" stroke-width="2"  marker-end="url(#a)"/><text x="465" y="100" font-size="11">heavy touch</text><line x1="625" y1="110" x2="565" y2="115" stroke="#2e7d32" stroke-width="2"  marker-end="url(#a)"/><text x="380" y="175" font-size="12" fill="#2e7d32">the touch sends the ball away from his foot,</text><text x="380" y="191" font-size="12" fill="#2e7d32">towards you, far enough that you reach it before</text><text x="380" y="207" font-size="12" fill="#2e7d32">his next touch: take it, with the hands, at the</text><text x="380" y="223" font-size="12" fill="#2e7d32">pace you can</text><text x="20" y="278" font-size="11" fill="#111">A working rule of the book's. "A stride" is a picture, not a measurement;</text><text x="20" y="294" font-size="11" fill="#111">direction and momentum decide who reaches the ball.</text></svg>