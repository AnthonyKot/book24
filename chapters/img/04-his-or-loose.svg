<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" font-family="Helvetica, Arial, sans-serif" font-size="13"><rect width="720" height="300" fill="#ffffff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111"/></marker></defs><rect x="20" y="20" width="330" height="260" fill="#f4f4f4" stroke="#111"/><text x="30" y="45" font-weight="bold">The ball is his</text><circle cx="90" cy="120" r="6" fill="#c62828"/><text x="60" y="150">striker</text><circle cx="115" cy="130" r="5" fill="#ffffff" stroke="#111"/><circle cx="290" cy="120" r="6" fill="#2e7d32"/><text x="278" y="150">you</text><text x="85" y="150" font-size="11">ball within a stride</text><line x1="270" y1="120" x2="220" y2="120" stroke="#2e7d32" stroke-width="2"  marker-end="url(#a)"/><text x="30" y="185" fill="#1a237e" font-size="12">touch keeps the ball under his control: stay on your</text><text x="30" y="202" fill="#1a237e" font-size="12">feet, keep closing at a pace you can stop from, make</text><text x="30" y="219" fill="#1a237e" font-size="12">him do something</text><rect x="370" y="20" width="330" height="260" fill="#f4f4f4" stroke="#111"/><text x="380" y="45" font-weight="bold">The ball is loose</text><circle cx="440" cy="120" r="6" fill="#c62828"/><text x="410" y="150">striker</text><circle cx="545" cy="130" r="5" fill="#ffffff" stroke="#111"/><circle cx="640" cy="120" r="6" fill="#2e7d32"/><text x="628" y="150">you</text><line x1="445" y1="125" x2="535" y2="130" stroke="#111" stroke-width="2"  marker-end="url(#a)"/><text x="480" y="150" font-size="11">heavy touch</text><line x1="625" y1="120" x2="565" y2="125" stroke="#2e7d32" stroke-width="2"  marker-end="url(#a)"/><text x="380" y="185" fill="#2e7d32" font-size="12">touch sends the ball away from his foot, towards you,</text><text x="380" y="202" fill="#2e7d32" font-size="12">far enough that you reach it before his next touch:</text><text x="380" y="219" fill="#2e7d32" font-size="12">take it, with the hands, at the pace you can</text><text x="360" y="292" text-anchor="middle" font-size="11">A working rule of the book's. "A stride" is a picture, not a measurement; direction and momentum decide who reaches the ball.</text></svg>