<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-labelledby="title desc">
  <title id="title">Check the route and the receiver</title>
  <desc id="desc">A short recipient with a clear route and a useful next action may be an outlet. A teammate beyond first pressure may be an alternative. Both require a delivery the keeper can execute. Neither distance guarantees success.</desc>
  <rect width="900" height="370" rx="16" fill="#f5f7f4"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#213c32">
    <text x="450" y="42" font-size="25" font-weight="bold">Can this teammate use the ball?</text>
    <rect x="45" y="75" width="810" height="55" rx="10" fill="#dce9df"/>
    <text x="450" y="110" font-size="20">Check route + receiver + a delivery you can execute</text>
    <rect x="45" y="175" width="380" height="100" rx="10" fill="#cce1d7"/>
    <rect x="475" y="175" width="380" height="100" rx="10" fill="#dfebf2"/>
    <text x="235" y="208" font-size="21" font-weight="bold">Nearby outlet</text>
    <text x="235" y="241" font-size="18">Clear route; useful first reception</text>
    <text x="665" y="208" font-size="21" font-weight="bold">Outlet beyond first pressure</text>
    <text x="665" y="241" font-size="18">Different space; achievable pass</text>
    <text x="450" y="316" font-size="18">If neither works, use the team's agreed fallback.</text>
    <text x="450" y="349" font-size="17">Distance alone does not make a pass useful. Practice does not test full-pitch range.</text>
  </g>
  <g fill="none" stroke="#426858" stroke-width="3">
    <path d="M235 130 V165 M228 157 L235 165 L242 157"/>
    <path d="M665 130 V165 M658 157 L665 165 L672 157"/>
  </g>
</svg>
