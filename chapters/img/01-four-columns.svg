<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" font-family="Helvetica, Arial, sans-serif" font-size="13"><rect width="760" height="480" fill="#ffffff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111"/></marker></defs><rect x="230" y="15" width="300" height="60" rx="6" fill="#f4f4f4" stroke="#111" stroke-width="2"/><text x="240" y="35" font-weight="bold" fill="#111">A goal goes in</text><text x="240" y="55" font-size="12">As you fetch the ball: what did you see</text><text x="240" y="70" font-size="12">last, before the shot?</text><rect x="230" y="110" width="300" height="88" rx="6" fill="#f4f4f4" stroke="#e65100" stroke-width="2"/><text x="240" y="130" font-weight="bold" fill="#e65100">Were you set when it was struck?</text><text x="240" y="150" font-size="12">Still moving when the ball left the foot:</text><text x="240" y="165" font-size="12">part of the goal is yours whatever</text><text x="240" y="180" font-size="12">happened next.</text><line x1="380" y1="75" x2="380" y2="110" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><rect x="10" y="260" width="170" height="135" rx="6" fill="#f4f4f4" stroke="#2e7d32" stroke-width="2"/><text x="20" y="280" font-weight="bold" fill="#2e7d32">Yours</text><text x="20" y="300" font-size="12">Your hand, foot or</text><text x="20" y="315" font-size="12">position in the wrong</text><text x="20" y="330" font-size="12">place. The only column</text><text x="20" y="345" font-size="12">that produces a training</text><text x="20" y="360" font-size="12">session.</text><line x1="380" y1="198" x2="95" y2="260" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><rect x="200" y="260" width="170" height="135" rx="6" fill="#f4f4f4" stroke="#1a237e" stroke-width="2"/><text x="210" y="280" font-weight="bold" fill="#1a237e">The defence's</text><text x="210" y="300" font-size="12">A shirt of the other</text><text x="210" y="315" font-size="12">colour arriving where</text><text x="210" y="330" font-size="12">one of yours could have</text><text x="210" y="345" font-size="12">been. Chapter 6 is the</text><text x="210" y="360" font-size="12">words that change this.</text><line x1="380" y1="198" x2="285" y2="260" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><rect x="390" y="260" width="170" height="135" rx="6" fill="#f4f4f4" stroke="#e65100" stroke-width="2"/><text x="400" y="280" font-weight="bold" fill="#e65100">The gap</text><text x="400" y="300" font-size="12">A faster, younger side</text><text x="400" y="315" font-size="12">scoring against any</text><text x="400" y="330" font-size="12">keeper behind any</text><text x="400" y="345" font-size="12">veterans' defence.</text><text x="400" y="360" font-size="12">Filled last: it</text><text x="400" y="375" font-size="12">flatters.</text><line x1="380" y1="198" x2="475" y2="260" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><rect x="580" y="260" width="170" height="135" rx="6" fill="#f4f4f4" stroke="#c62828" stroke-width="2"/><text x="590" y="280" font-weight="bold" fill="#c62828">Luck</text><text x="590" y="300" font-size="12">Deflection, a shot</text><text x="590" y="315" font-size="12">through a crowd, a slip.</text><text x="590" y="330" font-size="12">Small column; more than</text><text x="590" y="345" font-size="12">one in ten hides another</text><text x="590" y="360" font-size="12">column.</text><line x1="380" y1="198" x2="665" y2="260" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="20" y="214" font-size="12">one column, and one word for why: "mine, late" · "defence, runner" · "gap"</text><text x="20" y="420" font-size="12">A one-on-one is usually two entries: how he got there (defence or gap), and what you did once he had (yours).</text><text x="20" y="438" font-size="12">A rebound too: the first shot, and the ball you pushed out or could not hold. "Not seen" is a row of its own, and it is information.</text><text x="20" y="462" font-size="11" fill="#555">A working rule of the book's. Two people will sort the same goal differently; the result is the situations that keep appearing in the first column.</text></svg>